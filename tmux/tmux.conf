# ~/.tmux.conf -- symlinked from ~/mydotfiles/tmux/tmux.conf
#
# Mirrors my kitty split bindings. kitty forwards its shortcuts to tmux when
# a tmux client is focused (see IS_TMUX in kitty/kitty.conf):
#   ctrl+shift+o / ctrl+shift+e  -> prefix "  / prefix %   (splits)
#   ctrl+shift+x                 -> prefix z               (zoom)
#   ctrl+h/j/k/l, alt+shift+h/j/k/l are passed through and bound below.
# Native equivalents: tmux/tmux_cheat_sheet.md

#
# General
#
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"
set -sg escape-time 10        # nvim: no lag after <Esc>
set -g  focus-events on       # nvim: autoread / FocusGained
set -g  set-clipboard on      # forward OSC52 copies (nvim over ssh) to kitty
set -g  history-limit 100000  # scrollback now lives in tmux, not kitty
set -g  mode-keys vi          # copy mode: prefix [  ...  q to exit
set -ga update-environment " KITTY_LISTEN_ON"

# Mouse: wheel scrolls tmux history, click focuses a pane, drag resizes.
# Dragging copies on release (to the clipboard via OSC52) but keeps the
# highlight; q leaves copy mode. shift+drag uses kitty's own selection instead.
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# Copy mode like kitty-scrollback.nvim (kitty sends ctrl+shift+i as prefix [):
# vim motions, v / V / ctrl+v to select, y yanks to the clipboard and exits.
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v { send-keys -X begin-selection; send-keys -X rectangle-on }
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel

#
# Tell kitty a tmux client is in this window, so kitty forwards its keys.
# Written straight to the client tty, so it also works over ssh. Fires on
# new-session and attach. The shell prompt clears it again once tmux is gone
# (tmux/kitty_is_tmux.sh): detach/exit hooks have no client tty to write to.
#
set-hook -g client-session-changed 'run-shell "printf \"\\033]1337;SetUserVar=IS_TMUX=MQo\\007\" > #{client_tty}"'

#
# Splits: same as the defaults, but keep the current directory
#
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

#
# Navigation: ctrl+h/j/k/l across nvim splits, tmux panes and kitty windows.
#   - pane runs nvim (smart-splits sets @pane-is-vim) -> let nvim handle it
#   - pane is at the window edge                      -> focus the kitty neighbour
#   - otherwise                                       -> move to the next tmux pane
#
bind -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{&&:#{pane_at_left},#{?window_zoomed_flag,0,1}}'   { run-shell -b 'kitten @ focus-window --match neighbor:left   >/dev/null 2>&1 || true' } { select-pane -L } }
bind -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{&&:#{pane_at_bottom},#{?window_zoomed_flag,0,1}}' { run-shell -b 'kitten @ focus-window --match neighbor:bottom >/dev/null 2>&1 || true' } { select-pane -D } }
bind -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{&&:#{pane_at_top},#{?window_zoomed_flag,0,1}}'    { run-shell -b 'kitten @ focus-window --match neighbor:top    >/dev/null 2>&1 || true' } { select-pane -U } }
bind -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{&&:#{pane_at_right},#{?window_zoomed_flag,0,1}}'  { run-shell -b 'kitten @ focus-window --match neighbor:right  >/dev/null 2>&1 || true' } { select-pane -R } }

#
# Resize: alt+shift+h/j/k/l moves the border in that direction (like kitty)
#
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

# Close a split: ctrl+d (shell EOF) already closes the pane, no binding needed.
